<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcel Prices</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reference.css">
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="title">Parcel Reference Prices</div>
    <div class="right">
      <span class="hint" id="hint">Loading…</span>
      <div class="toggle" id="toggle">
        <button data-mode="2021" class="active">2021</button>
        <button data-mode="2024">2024</button>
        <span class="sep"></span>
        <button data-mode="compare" title="Swipe between 2021 and 2024">Compare</button>
      </div>
    </div>
  </div>
  <div class="stage">
    <div id="viewDiv"></div>
    <div class="swipe-tag" id="tagLeft"></div>
    <div class="swipe-tag" id="tagRight"></div>
    <div id="overlay"><span class="spin"></span> <span id="overlayText">Loading your web map…</span></div>
  </div>
</div>

<script src="https://js.arcgis.com/4.28/"></script>
<script src="reference.js"></script>
</body>
</html>
